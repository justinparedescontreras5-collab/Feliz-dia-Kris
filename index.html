<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Kris ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Corazones flotando -->
    <div id="corazones"></div>

    <!-- Botón música -->
    <button id="musicaBtn">

        🎵 Reproducir música

    </button>

    <!-- Contenido -->

    <div class="contenedor">

        <h1 class="titulo">

            💖 Feliz Día de la Novia 💖

        </h1>

        <h2 class="subtitulo">

            Para la persona más hermosa del mundo ❤️

        </h2>

        <p class="mensaje">

            Gracias por llegar a mi vida.<br><br>

            Desde que llegaste todo es mucho más bonito.
            Espero que este pequeño detalle te saque una sonrisa,
            porque lo hice con muchísimo cariño para ti.

        </p>

        <div class="gif">

            <img src="osito.gif">

        </div>

        <button class="boton">

            💌 Ábreme 💌

        </button>

    </div>

    <!-- Carta -->

    <div id="carta">

        <div class="contenidoCarta">

            <h2>

                Para ti ❤️

            </h2>

            <p>

                Aquí irá la carta más adelante.

            </p>

            <button id="cerrarCarta">

                Cerrar

            </button>

        </div>

    </div>

    <audio id="musica" loop>

        <source src="musica.mp3" type="audio/mpeg">

    </audio>

    <script src="script.js"></script>

</body>

</html>
